{% set name = "scarab" %}
{% set version = "0.0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/RyloByte/scarab/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 724696040ca99f15ca24698c8fe01e58fceffb8f386a1985deaa4e7b71169dd0

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"

requirements:
  host:
    - python ==3.10.6=h582c2e5_0_cpython
    - pip ==23.1.2=pyhd8ed1ab_0
    - setuptools ==68.0.0=pyhd8ed1ab_0
    - wheel
  run:
    - python ==3.10.6=h582c2e5_0_cpython
    - numpy ==1.24.4=py310ha4c1d20_0
    - pandas ==2.0.3=py310h7cbd5c2_1
    - scipy ==1.11.1=py310ha4c1d20_0
    - scikit-learn ==1.3.0=py310hf7d194e_0
    - umap-learn ==0.5.3=py310hff52083_1
    - hdbscan ==0.8.30=py310h278f3c1_0
    - numba ==0.57.1=py310h0f6aa51_0
    - scikit-bio ==0.5.8=py310h0a54255_1
    - sourmash ==4.8.2=hdfd78af_0
    - sourmash-minimal ==4.8.2=py310hcb5633a_1
    - screed ==1.1.2=pyhd8ed1ab_0
    - six ==1.16.0=pyh6c4a22f_0
    - pyfastx ==1.1.0=py310h83093d7_3
    - minimap2 ==2.26=he4a0461_1
    - samtools ==1.16.1=h6899075_1
    - htslib ==1.16=h6bc39ce_0
    - metabat2 ==2.15=h4da6f23_2
    - bbmap ==39.01=h92535d8_1
    - seqkit ==2.4.0=h9ee0642_0
    - perl ==5.32.1=3_hd590300_perl5
test:
  commands:
    - scarab info -h

about:
  home: https://github.com/hallamlab/scarab
  license: GPL-3.0
  license_file: LICENSE
  summary: SCARAB recruits metagenomic reads using single-cell amplified genomes as references.

extra:
  recipe-maintainers:
    - hallamlab
